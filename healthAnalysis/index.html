<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Census - Health Conditions Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
        }
        
        .health-selector {
            margin-bottom: 30px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
        }
        
        select {
            width: 100%;
            padding: 12px;
            font-size: 1em;
            border: 2px solid #667eea;
            border-radius: 5px;
            cursor: pointer;
            background-color: white;
        }
        
        select:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
        }
        
        .health-info {
            display: none;
            animation: slideIn 0.3s ease-in;
        }
        
        .health-info.active {
            display: block;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .health-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }
        
        .health-image {
            text-align: center;
        }
        
        .health-image img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .health-details h2 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 20px;
        }
        
        .section {
            margin-bottom: 25px;
        }
        
        .section h3 {
            color: #764ba2;
            font-size: 1.3em;
            margin-bottom: 10px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 5px;
        }
        
        .section ul {
            list-style-position: inside;
            color: #555;
            line-height: 1.8;
        }
        
        .section ul li {
            margin-bottom: 8px;
        }
        
        .section p {
            color: #555;
            line-height: 1.8;
        }
        
        .nav-links {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }
        
        .nav-links a {
            display: inline-block;
            margin: 0 15px;
            padding: 10px 20px;
            background-color: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        .nav-links a:hover {
            background-color: #764ba2;
        }
        
        @media (max-width: 768px) {
            .health-card {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏥 Health Census</h1>
            <p class="subtitle">Learn about common health conditions, symptoms, prevention, and treatment</p>
        </header>
        
        <div class="health-selector">
            <label for="conditionSelect">Select a Health Condition:</label>
            <select id="conditionSelect">
                <option value="">-- Choose a Condition --</option>
                <option value="Thyroid">Thyroid</option>
                <option value="Diabetes">Diabetes</option>
                <option value="High Blood Pressure">High Blood Pressure</option>
            </select>
        </div>
        
        <div id="healthInfoContainer"></div>
        
        <div class="nav-links">
            <a href="health_contact.html">📞 Contact Us</a>
        </div>
    </div>
    
    <script>
        // Health data embedded in the HTML file
        const healthData = [
            {
                "name": "Thyroid",
                "imagesrc": "thyroid.jpg",
                "symptoms": [
                    "Fatigue",
                    "Weight gain or loss",
                    "Dry skin",
                    "Muscle weakness",
                    "Irregular menstrual periods"
                ],
                "prevention": [
                    "Eat a balanced diet",
                    "Exercise regularly",
                    "Get regular check-ups"
                ],
                "treatment": "Medication like levothyroxine may be prescribed by a doctor."
            },
            {
                "name": "Diabetes",
                "imagesrc": "diabetes.jpg",
                "symptoms": [
                    "Frequent urination",
                    "Increased thirst",
                    "Blurry vision",
                    "Fatigue",
                    "Slow healing of cuts or sores"
                ],
                "prevention": [
                    "Maintain a healthy weight",
                    "Follow a balanced diet",
                    "Regular exercise"
                ],
                "treatment": "Management includes medication, insulin therapy, and lifestyle changes."
            },
            {
                "name": "High Blood Pressure",
                "imagesrc": "blood_pressure.jpg",
                "symptoms": [
                    "Headaches",
                    "Shortness of breath",
                    "Chest pain",
                    "Dizziness",
                    "Blurred or double vision"
                ],
                "prevention": [
                    "Reduce salt intake",
                    "Exercise regularly",
                    "Maintain a healthy weight"
                ],
                "treatment": "Medications like ACE inhibitors or diuretics may be prescribed."
            }
        ];

        // Event listener for condition selection
        document.getElementById('conditionSelect').addEventListener('change', function() {
            const selectedCondition = this.value;
            const healthInfoContainer = document.getElementById('healthInfoContainer');
            
            if (selectedCondition === '') {
                healthInfoContainer.innerHTML = '';
                return;
            }

            // Find the selected condition in the data
            const condition = healthData.find(c => c.name === selectedCondition);
            
            if (condition) {
                displayHealthInfo(condition);
            }
        });

        // Function to display health information
        function displayHealthInfo(condition) {
            const healthInfoContainer = document.getElementById('healthInfoContainer');
            let symptomsHTML = condition.symptoms.map(symptom => `<li>${symptom}</li>`).join('');
            let preventionHTML = condition.prevention.map(prev => `<li>${prev}</li>`).join('');

            const healthHTML = `
                <div class="health-info active">
                    <div class="health-card">
                        <div class="health-image">
                            <img src="${condition.imagesrc}" alt="${condition.name}">
                        </div>
                        <div class="health-details">
                            <h2>${condition.name}</h2>
                            
                            <div class="section">
                                <h3>Symptoms</h3>
                                <ul>
                                    ${symptomsHTML}
                                </ul>
                            </div>
                            
                            <div class="section">
                                <h3>Prevention</h3>
                                <ul>
                                    ${preventionHTML}
                                </ul>
                            </div>
                            
                            <div class="section">
                                <h3>Treatment</h3>
                                <p>${condition.treatment}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            healthInfoContainer.innerHTML = healthHTML;
        }
    </script>
</body>
</html>
